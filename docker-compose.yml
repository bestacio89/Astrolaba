# Base de données de DÉVELOPPEMENT (PostgreSQL 17 dans un conteneur Docker).
# Démarrer : docker compose up -d
# Arrêter : docker compose down
# Ces identifiants sont réservés au développement local et ne doivent pas être réutilisés ailleurs.
services:
  postgres:
    image: postgres:17-alpine
    container_name: pilotage-postgres
    environment:
      POSTGRES_DB: PilotageForfaits
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Dev_Pilotage_2026!"
    ports:
      - "5432:5432"
    volumes:
      - donnees-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d PilotageForfaits"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  donnees-postgres:
