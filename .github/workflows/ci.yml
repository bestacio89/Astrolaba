# Validate backend, frontend, and deterministic reference scenarios on every push and pull request.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: .NET build, tests, and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restore
        run: dotnet restore PilotageForfaits.sln
      - name: Build
        run: dotnet build PilotageForfaits.sln --no-restore --configuration Release
      - name: Test and collect coverage
        run: dotnet test PilotageForfaits.sln --no-build --configuration Release --logger trx --results-directory resultats-tests --collect:"XPlat Code Coverage"
      - name: Publish test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/resultats-tests/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Angular build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Restore Angular build cache
        uses: actions/cache@v4
        with:
          path: frontend/.angular/cache
          key: angular-${{ runner.os }}-${{ hashFiles('frontend/package.json', 'frontend/angular.json', 'frontend/tsconfig*.json') }}
          restore-keys: |
            angular-${{ runner.os }}-
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  reference:
    name: Verify reference scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate reference scenarios
        run: TODAY=2026-10-06 node outils/reference-poc/scenarios.cjs "$RUNNER_TEMP/reference"
      - name: Compare reference scenarios
        run: |
          set -eu
          for file in "$RUNNER_TEMP"/reference/*.json; do
            diff -q "$file" "backend/tests/Donnees/$(basename "$file")"
          done
